services:
  gitea:
    image: gitea/gitea:1.22.0
    container_name: tapm-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__security__INSTALL_LOCK=true
      - GITEA__security__SECRET_KEY=${GITEA_SECRET_KEY:-local-stack-tapm-secret-key-32chars}
      - GITEA__server__ROOT_URL=http://localhost:3000/
      - GITEA__server__DOMAIN=localhost
      - GITEA__server__HTTP_PORT=3000
      - GITEA__actions__ENABLED=true
      - GITEA__actions__DEFAULT_ACTIONS_URL=github
      - GITEA__service__DISABLE_REGISTRATION=false
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
    ports:
      - "3000:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data
    networks:
      - tapm-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/api/v1/version || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  runner:
    image: gitea/act_runner:latest
    container_name: tapm-runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      - CONFIG_FILE=/config.yaml
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN:-}
      - GITEA_RUNNER_NAME=tapm-act-runner
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://catthehacker/ubuntu:act-latest,ubuntu-24.04:docker://catthehacker/ubuntu:act-24.04,tapm:docker://terraform-attack-paths-pytm:latest
      - DOCKER_HOST=unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - runner-data:/data
      - ./config.yaml:/config.yaml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tapm-net

  analysis-service:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: terraform-attack-paths-pytm:latest
    container_name: tapm-service
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      - TAPM_SERVER_TOKEN=${TAPM_SERVER_TOKEN:-demo-secret-token}
      - GITEA_TOKEN=${GITEA_TOKEN:-}
      - GITEA_BASE_URL=http://gitea:3000
      - TAPM_LLM=${TAPM_LLM:-simulated}
      - TAPM_JEV=${TAPM_JEV:-local}
      - TAPM_MODEL=${TAPM_MODEL:-}
      - OLLAMA_HOST=http://host.docker.internal:11434
    ports:
      - "8080:8080"
    volumes:
      - ./service-entrypoint.sh:/opt/tapm-service-entrypoint.sh:ro
    command: ["sh", "/opt/tapm-service-entrypoint.sh"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - tapm-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

networks:
  tapm-net:
    name: tapm-local-stack
    driver: bridge

volumes:
  gitea-data:
  runner-data:
