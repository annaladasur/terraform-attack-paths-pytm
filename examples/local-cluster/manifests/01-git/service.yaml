apiVersion: v1
kind: Service
metadata:
  name: gitea
  namespace: git
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: tapm-local-cluster
    app.kubernetes.io/component: git-server
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: gitea
  ports:
    - name: http
      port: 3000
      targetPort: 3000
      nodePort: 30000
      protocol: TCP
    - name: ssh
      port: 22
      targetPort: 2222
      nodePort: 30022
      protocol: TCP
