apiVersion: apps/v1
kind: Deployment
metadata:
  name: gitea
  namespace: git
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: tapm-local-cluster
    app.kubernetes.io/component: git-server
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gitea
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gitea
        app.kubernetes.io/part-of: tapm-local-cluster
        app.kubernetes.io/component: git-server
    spec:
      securityContext:
        fsGroup: 1000
      initContainers:
        - name: init-config
          image: gitea/gitea:1.22.0
          command:
            - sh
            - -c
            - |
              mkdir -p /data/gitea/conf
              if [ ! -f /data/gitea/conf/app.ini ] || ! grep -q "\[database\]" /data/gitea/conf/app.ini; then
                cp /config/app.ini /data/gitea/conf/app.ini
              fi
              chown -R 1000:1000 /data
              chmod 664 /data/gitea/conf/app.ini
          volumeMounts:
            - name: data
              mountPath: /data
            - name: config
              mountPath: /config
      containers:
        - name: gitea
          image: gitea/gitea:1.22.0
          imagePullPolicy: IfNotPresent
          env:
            - name: USER_UID
              value: "1000"
            - name: USER_GID
              value: "1000"
            - name: GITEA__database__DB_TYPE
              value: "sqlite3"
            - name: GITEA__database__PATH
              value: "/data/gitea/gitea.db"
            - name: GITEA__security__INSTALL_LOCK
              value: "true"
            - name: GITEA__actions__ENABLED
              value: "true"
            - name: GITEA__server__ROOT_URL
              value: "http://localhost:3000/"
            - name: GITEA__server__DOMAIN
              value: "localhost"
            - name: GITEA__server__HTTP_PORT
              value: "3000"
            - name: GITEA__security__SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: gitea-secret
                  key: secret-key
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
            - name: ssh
              containerPort: 2222
              protocol: TCP
          volumeMounts:
            - name: data
              mountPath: /data
          livenessProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /api/v1/version
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: gitea-data-pvc
        - name: config
          configMap:
            name: gitea-config
