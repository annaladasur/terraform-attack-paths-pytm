apiVersion: v1
kind: ConfigMap
metadata:
  name: gitea-config
  namespace: git
  labels:
    app.kubernetes.io/name: gitea
    app.kubernetes.io/part-of: tapm-local-cluster
data:
  app.ini: |
    APP_NAME = TAPM Local Cluster Gitea
    RUN_MODE = prod
    RUN_USER = git

    [security]
    INSTALL_LOCK = true
    SECRET_KEY = local-cluster-tapm-secret-key-32chars-min

    [server]
    APP_DATA_PATH = /data/gitea
    DOMAIN = localhost
    SSH_DOMAIN = localhost
    HTTP_PORT = 3000
    ROOT_URL = http://localhost:3000/
    DISABLE_SSH = false
    SSH_PORT = 2222
    START_SSH_SERVER = true

    [database]
    DB_TYPE = sqlite3
    PATH = /data/gitea/gitea.db

    [actions]
    ENABLED = true
    DEFAULT_ACTIONS_URL = github

    [service]
    DISABLE_REGISTRATION = false
    REQUIRE_SIGNIN_VIEW = false

    [log]
    MODE = console
    LEVEL = info
