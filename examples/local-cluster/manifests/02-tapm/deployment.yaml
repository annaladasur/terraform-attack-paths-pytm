apiVersion: apps/v1
kind: Deployment
metadata:
  name: tapm-service
  namespace: tapm
  labels:
    app.kubernetes.io/name: tapm-service
    app.kubernetes.io/part-of: tapm-local-cluster
    app.kubernetes.io/component: analysis-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tapm-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tapm-service
        app.kubernetes.io/part-of: tapm-local-cluster
        app.kubernetes.io/component: analysis-service
    spec:
      containers:
        - name: tapm-service
          image: terraform-attack-paths-pytm:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: TAPM_SERVER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tapm-secret
                  key: tapm-server-token
            - name: GITEA_TOKEN
              valueFrom:
                secretKeyRef:
                  name: tapm-secret
                  key: gitea-token
                  optional: true
            - name: GITEA_BASE_URL
              valueFrom:
                configMapKeyRef:
                  name: tapm-config
                  key: GITEA_BASE_URL
            - name: TAPM_LLM
              valueFrom:
                configMapKeyRef:
                  name: tapm-config
                  key: TAPM_LLM
            - name: TAPM_JEV
              valueFrom:
                configMapKeyRef:
                  name: tapm-config
                  key: TAPM_JEV
            - name: TAPM_MODEL
              valueFrom:
                configMapKeyRef:
                  name: tapm-config
                  key: TAPM_MODEL
                  optional: true
            - name: OLLAMA_HOST
              valueFrom:
                configMapKeyRef:
                  name: tapm-config
                  key: OLLAMA_HOST
          command:
            - sh
            - -c
            - >
              tapm serve --host 0.0.0.0 --port 8080
              --token "${TAPM_SERVER_TOKEN:-demo-secret-token}"
              --git-server gitea
              --git-base-url "${GITEA_BASE_URL:-http://gitea.git.svc.cluster.local:3000}"
              --git-token "${GITEA_TOKEN:-}"
              --llm "${TAPM_LLM:-simulated}"
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
