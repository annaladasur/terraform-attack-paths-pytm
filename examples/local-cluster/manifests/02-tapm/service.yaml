apiVersion: v1
kind: Service
metadata:
  name: tapm-service
  namespace: tapm
  labels:
    app.kubernetes.io/name: tapm-service
    app.kubernetes.io/part-of: tapm-local-cluster
    app.kubernetes.io/component: analysis-service
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: tapm-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
      protocol: TCP
