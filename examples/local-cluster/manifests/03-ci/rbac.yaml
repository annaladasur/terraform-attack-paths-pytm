apiVersion: v1
kind: ServiceAccount
metadata:
  name: tapm-runner
  namespace: ci
  labels:
    app.kubernetes.io/name: act-runner
    app.kubernetes.io/part-of: tapm-local-cluster
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tapm-runner-role
  namespace: ci
  labels:
    app.kubernetes.io/name: act-runner
    app.kubernetes.io/part-of: tapm-local-cluster
rules:
  - apiGroups: [""]
    resources: ["pods", "pods/log", "pods/exec"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["secrets", "configmaps"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: tapm-runner-binding
  namespace: ci
  labels:
    app.kubernetes.io/name: act-runner
    app.kubernetes.io/part-of: tapm-local-cluster
subjects:
  - kind: ServiceAccount
    name: tapm-runner
    namespace: ci
roleRef:
  kind: Role
  name: tapm-runner-role
  apiGroup: rbac.authorization.k8s.io
