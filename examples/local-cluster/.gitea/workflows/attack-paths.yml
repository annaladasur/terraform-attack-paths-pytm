name: Terraform attack-path review

"on":
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  attack-paths:
    name: attack-paths
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
        continue-on-error: true

      - name: Locate or generate Terraform plan JSON
        id: plan
        run: |
          mkdir -p /tmp/tapm-run
          if [ -f plan.json ]; then
            echo "Using committed plan.json"
            cp plan.json /tmp/tapm-run/plan.json
          elif [ -f tfplan.json ]; then
            echo "Using committed tfplan.json"
            cp tfplan.json /tmp/tapm-run/plan.json
          elif command -v terraform >/dev/null 2>&1; then
            echo "Running terraform plan..."
            terraform init -input=false
            terraform plan -input=false -lock=false -out=/tmp/tapm-run/tfplan
            terraform show -json /tmp/tapm-run/tfplan > /tmp/tapm-run/plan.json
            rm -f /tmp/tapm-run/tfplan
          else
            echo "Error: No plan.json found and terraform CLI is not installed." >&2
            exit 1
          fi

      - name: Submit plan to TAPM analysis service
        env:
          TAPM_SERVER_URL: ${{ vars.TAPM_SERVER_URL || 'http://tapm-service.tapm.svc.cluster.local:8080' }}
          TAPM_SERVER_TOKEN: ${{ secrets.TAPM_SERVER_TOKEN || 'demo-secret-token' }}
          TAPM_LEVEL: ${{ vars.TAPM_LEVEL || 'validate' }}
        run: |
          mkdir -p ./artifacts
          PR_NUM="${{ github.event.pull_request.number }}"
          [ -z "$PR_NUM" ] && PR_NUM="0"

          echo "Submitting plan to ${TAPM_SERVER_URL} (level=${TAPM_LEVEL}, PR=${PR_NUM})..."

          if command -v tapm >/dev/null 2>&1; then
            tapm submit /tmp/tapm-run/plan.json \
              --server "${TAPM_SERVER_URL}" \
              --token "${TAPM_SERVER_TOKEN}" \
              --level "${TAPM_LEVEL}" \
              --source-dir . \
              --repo "${{ github.repository }}" \
              --pr "${PR_NUM}" \
              --sha "${{ github.sha }}" \
              --out ./artifacts \
              --timeout 120
          else
            echo "tapm CLI not found on runner host; using curl runner client..."
            PR_NUM="${PR_NUM}" python3 - <<'PY_SOURCE'
          import json, os, sys
          from pathlib import Path
          source_root = Path(".").resolve()
          source_files = {}
          def source_error(error):
              raise error
          for folder, dirs, names in os.walk(source_root, followlinks=False, onerror=source_error):
              directory = Path(folder)
              dirs[:] = sorted(d for d in dirs if d not in {".git", ".terraform"} and not (directory / d).is_symlink())
              for name in sorted(names):
                  if not name.endswith(".tf"):
                      continue
                  path = directory / name
                  if path.is_symlink() or not path.is_file():
                      raise ValueError("Terraform source must be a regular file")
                  source_files[path.relative_to(source_root).as_posix()] = path.read_bytes().decode("utf-8")
          with open("/tmp/tapm-run/plan.json", encoding="utf-8") as stream:
              plan_data = json.load(stream)
          with open("/tmp/tapm-run/request.json", "w", encoding="utf-8") as stream:
              json.dump({"repo": "${{ github.repository }}", "pr": int(os.environ["PR_NUM"]),
                         "sha": "${{ github.sha }}", "root_module": ".", "level": os.environ["TAPM_LEVEL"],
                         "plan_json": plan_data, "source_files": source_files}, stream)
          PY_SOURCE
            JOB_ID=$(curl -sf -X POST "${TAPM_SERVER_URL}/v1/jobs" \
              -H "Authorization: Bearer ${TAPM_SERVER_TOKEN}" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/tapm-run/request.json \
              | python3 -c 'import json,sys; job=json.load(sys.stdin); print(job.get("id") or job["job_id"])')

            echo "Job submitted: ${JOB_ID}"
            STATUS="queued"
            for i in $(seq 1 30); do
              RESP=$(curl -sf "${TAPM_SERVER_URL}/v1/jobs/${JOB_ID}" -H "Authorization: Bearer ${TAPM_SERVER_TOKEN}")
              STATUS=$(echo "$RESP" | python3 -c 'import json,sys; print(json.load(sys.stdin)["status"])')
              VERDICT=$(echo "$RESP" | python3 -c 'import json,sys; job=json.load(sys.stdin); print(job.get("verdict") or job.get("gate_verdict") or "")')
              if [ "$STATUS" = "completed" ] || [ "$STATUS" = "enriched" ]; then
                echo "Job completed with verdict: ${VERDICT}"
                if [ "$VERDICT" = "blocked" ]; then
                  echo "Gate blocked by unaccepted attack paths." >&2
                  exit 3
                fi
                exit 0
              fi
              sleep 2
            done
            echo "Timeout waiting for job completion" >&2
            exit 1
          fi
