# Level 5 of the adoption ladder (kit/adoption-ladder.md): prove every night that the check still works, and catch
# accepted risks that expired on the default branch without waiting for a pull request.
#
# Same supply-chain rules as pr-security.yml: pin actions to full commit SHAs, read-only OIDC role, never upload
# plan.json.
#
# Sharded sweep (W1.5, Critic B M4):
# For repositories with dozens or hundreds of root modules, the default branch sweep is sharded across
# parallel matrix runners using `tapm matrix . --all --shards N --shard-index ${{ matrix.shard }}`.
name: Attack-path check, nightly

on:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write
  issues: write            # open an issue when the check regresses

env:
  TF_DIR: infra

jobs:
  canary:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4                       # pin to full SHA
      - uses: actions/setup-python@v5                   # pin to full SHA
        with: { python-version: "3.12" }
      - name: Install
        run: python -m pip install "terraform-attack-paths-pytm @ git+https://github.com/<you>/terraform-attack-paths-pytm@<sha>"
      - name: Known-bad plans must block, known-good must pass (M15)
        # Add your own canaries: directories with a plan.json and a canary.yaml (expect: block | pass).
        run: tapm canary --level prevent --fail-on high --json canary.json
      - name: Open an issue when a canary fails
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue create --title "Attack-path check regressed (nightly canary)" --body-file canary.json --label security

  default-branch:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4                       # pin to full SHA
      - uses: hashicorp/setup-terraform@v3              # pin to full SHA
        with: { terraform_version: 1.16.4, terraform_wrapper: false }
      - uses: actions/setup-python@v5                   # pin to full SHA
        with: { python-version: "3.12" }
      - uses: aws-actions/configure-aws-credentials@v4  # pin to full SHA; role with ReadOnlyAccess only
        with: { role-to-assume: "${{ vars.PLAN_ROLE_ARN }}", aws-region: us-east-1 }
      - name: Install
        run: python -m pip install "terraform-attack-paths-pytm @ git+https://github.com/<you>/terraform-attack-paths-pytm@<sha>"
      - name: Sharded nightly sweep across root modules (W1.5, Critic B M4)
        run: |
          tapm matrix . --all --shards 4 --shard-index ${{ matrix.shard }} --format text > modules.txt
          echo "Shard ${{ matrix.shard }}/4 modules to sweep:"
          cat modules.txt
          while IFS= read -r MOD; do
            [ -z "$MOD" ] && continue
            echo "== Planning and evaluating root module: $MOD =="
            (
              cd "$MOD"
              terraform init -input=false
              terraform plan -input=false -lock=false -out=tfplan
              terraform show -json tfplan > "$RUNNER_TEMP/plan.json"
              rm -f tfplan
            )
            OUT="paths-$(echo "$MOD" | tr '/' '-')"
            tapm run "$MOD" --plan "$RUNNER_TEMP/plan.json" --out "$OUT" --llm off --no-dfd
            tapm gate "$OUT" --tf-dir "$MOD" --level "${{ vars.TAPM_LEVEL || 'observe' }}" --fail-on high
            tapm measure "$OUT" --json > "$OUT/measure.json"
          done < modules.txt
      - uses: actions/upload-artifact@v4                # pin to full SHA; counts and check only, never plan.json
        if: always()
        with:
          name: attack-path-counts-shard-${{ matrix.shard }}
          path: |
            paths-*/measure.json
            paths-*/gate.md
            paths-*/gate.json
