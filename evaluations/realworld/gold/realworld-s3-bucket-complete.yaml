# Real-world benign modules gold labels: reachability (entry -> target).
# Derived from module documentation and declared sensitive targets before engine run.
# VALID = documented as exploitable; INVALID = documented as not exploitable (benign / quiet); OUT_OF_SCOPE = unmodeled.
case: realworld-s3-bucket-complete
documented_by: README.md, examples/complete/main.tf
targets:
  - module.s3_bucket.aws_s3_bucket.this[0]
expected:
  - entry: internet
    target: module.s3_bucket.aws_s3_bucket.this[0]
    label: INVALID
    route: public access block enabled, bucket policy enforces TLS and denies unauthenticated access; no public route
