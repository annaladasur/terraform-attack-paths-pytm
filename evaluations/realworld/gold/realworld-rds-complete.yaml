# Real-world benign modules gold labels: reachability (entry -> target).
# Derived from module documentation and declared sensitive targets before engine run.
# VALID = documented as exploitable; INVALID = documented as not exploitable (benign / quiet); OUT_OF_SCOPE = unmodeled.
case: realworld-rds-complete
documented_by: README.md, examples/complete-postgres/main.tf
targets:
  - module.db.module.db_instance.aws_db_instance.this[0]
expected:
  - entry: internet
    target: module.db.module.db_instance.aws_db_instance.this[0]
    label: INVALID
    route: publicly_accessible is false, database deployed in private DB subnet group without internet route, security group permits no public ingress
