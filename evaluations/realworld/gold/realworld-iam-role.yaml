case: realworld-iam-role
documented_by: README.md, examples/iam-role/main.tf
targets:
  - module.iam_roles["admin"].aws_iam_role.this[0]
expected:
  - entry: internet
    target: module.iam_roles["admin"].aws_iam_role.this[0]
    label: INVALID
    route: trust relationship restricts sts:AssumeRole to specific trusted principal ARN with MFA required; no untrusted access
