# Tier-2 gold labels: reachability (entry -> target), derived ONLY from the project's own documentation
# and source, written before the engine ran on this case. Reviewer 2: PENDING.
# VALID = documented as exploitable; INVALID = documented as not exploitable; OUT_OF_SCOPE = the documented
# route depends on something the plan cannot show (credentials stored in data, disabled modules, runtime state).
case: cloudgoat-rds_snapshot
documented_by: README.md, cheat_sheet.md
targets:
- aws_db_instance.cg-rds-db_instance
expected:
- entry: internet
  target: aws_db_instance.cg-rds-db_instance
  label: OUT_OF_SCOPE
  precondition: SSH access to cg-ec2-instance
  route: internet -> SSH to cg-ec2-instance -> cg-ec2-admin-role accesses S3 bucket holding access_keys.txt (credentials in data) -> steals David's credentials -> cg-david restores cg-rds_snapshot and modifies DB instance password to retrieve flag
- entry: aws_iam_user.cg-david
  target: aws_db_instance.cg-rds-db_instance
  label: VALID
  route: cg-david has rds:RestoreDBInstanceFromDBSnapshot and rds:ModifyDBInstance on * -> restores snapshot and modifies DB instance to take over the database
