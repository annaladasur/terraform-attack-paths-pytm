# Tier-2 gold labels: reachability (entry -> target), derived ONLY from the project's own documentation
# and source, written before the engine ran on this case. Reviewer 2: PENDING.
# VALID = documented as exploitable; INVALID = documented as not exploitable; OUT_OF_SCOPE = the documented
# route depends on something the plan cannot show (credentials stored in data, disabled modules, runtime state).
case: cloudgoat-codebuild_secrets
documented_by: README.md, cheat_sheet_solo.md, cheat_sheet_calrissian.md
targets:
- aws_db_instance.cg-psql-rds
expected:
- entry: aws_iam_user.cg-solo
  target: aws_db_instance.cg-psql-rds
  label: OUT_OF_SCOPE
  route: solo discovers calrissian credentials stored in CodeBuild environment variables (credentials in data) -> calrissian creates and restores RDS snapshot with reset password; alternative route steals SSH key from SSM parameter -> EC2 IMDS -> RDS credentials in Lambda environment variables (both routes depend on secrets stored in data)
- entry: aws_iam_user.cg-calrissian
  target: aws_db_instance.cg-psql-rds
  label: VALID
  route: calrissian has rds:CreateDBSnapshot, rds:RestoreDBInstanceFromDBSnapshot, and rds:ModifyDBInstance permissions -> snapshots private RDS instance, restores new instance with modified admin password to access data
