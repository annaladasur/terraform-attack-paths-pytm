# Standalone CI workflow for terraform-attack-paths-pytm.
# Tests, offline demo, negative security checks, and benchmark replay.
# Everything replays from committed plans and baselines without cloud credentials.
# All GitHub Actions are pinned by full 40-character commit SHA.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test-and-demo
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: pyproject.toml

      - name: Install system dependencies (graphviz)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends graphviz

      - name: Set up virtualenv and dependencies
        run: make setup

      - name: Run test suite
        run: make test

      - name: Run offline demo
        run: NO_COLOR=1 make demo LLM=simulated

      - name: Run negative security tests (AI boundary)
        run: NO_COLOR=1 make security-tests

      - name: Run deterministic replay verification
        run: NO_COLOR=1 make replay

      - name: Report in job summary
        run: cat artifacts/006-public-workload-iam-sensitive-bucket/report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload demo artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba8afd # v4.4.0
        with:
          name: demo-artifacts
          path: artifacts/006-public-workload-iam-sensitive-bucket
